<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архив постов</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<!-- Header -->
<header>
  <h1>📚 Архив постов</h1>
  <div class="user-controls">
    <div id="guest-controls">
      <button id="login-btn" class="btn btn-primary">Войти</button>
    </div>

    <div id="user-controls" style="display: none;">
      <span id="user-login-display">Пользователь</span>
      <span id="user-access-display" class="status-badge" style="font-size:12px;">Роль: Гость</span>
      <a href="admin.html" id="admin-link" style="display: none; text-decoration: none;">
        <button class="btn btn-warning" style="padding: 4px 12px; font-size: 12px;">Админ-панель</button>
      </a>
      <button id="logout-btn" class="btn btn-danger">Выйти</button>
    </div>
  </div>
</header>

<!-- Control panel -->
<div class="controls-panel">
  <button id="create-post-btn" class="btn btn-success" style="display: none;">
    ➕ Добавить пост
  </button>

  <button id="refresh-posts-btn" class="btn btn-secondary">
    🔄 Обновить посты
  </button>

  <!-- Search bar -->
  <div class="search-container">
    <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="🔍 Поиск постов..."
            autocomplete="off"
    >
    <button id="search-btn" class="btn btn-primary" type="button">Найти</button>
  </div>
  <span id="last-update" class="last-update">Последнее обновление: --:--:--</span>
</div>

<!-- Post list -->
<div id="posts-container">
  <div class="loading">Загрузка постов...</div>
</div>

<!-- Posts pagination -->
<div id="pagination-panel" class="pagination-panel" style="display: none;">
  <div class="pagination-perpage">
    <label for="perpage-input">Постов на странице:</label>
    <input
            type="number"
            id="perpage-input"
            class="perpage-input"
            min="1"
            max="50"
            value="5"
    >
  </div>

  <div class="pagination-controls">
    <button id="prev-page-btn" class="btn btn-secondary" type="button">← Назад</button>
    <span id="page-info" class="page-info">Стр. 1 / 1</span>
    <button id="next-page-btn" class="btn btn-secondary" type="button">Вперёд →</button>
  </div>
</div>

<!-- Modal for post creating -->
<div id="create-post-modal" class="modal">
  <div class="modal-content">
    <h2>Создать новый пост</h2>
    <form id="create-post-form" enctype="multipart/form-data">
      <div class="form-group">
        <label for="post-title">Заголовок *</label>
        <input type="text" id="post-title" placeholder="Введите заголовок" required>
      </div>
      <div class="form-group">
        <label for="post-content">Содержание *</label>
<!--        <textarea id="post-content" placeholder="Введите содержание поста" required></textarea>-->
        <textarea id="post-content" placeholder="Введите содержание поста"></textarea>
      </div>
      <div class="form-group">
        <label for="post-link">🔗 Ссылка (необязательно)</label>
        <input type="url" id="post-link" placeholder="https://example.com">
      </div>
      <div id="file-list" class="file-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-create-btn">Отмена</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
